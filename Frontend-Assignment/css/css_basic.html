<!DOCTYPE html>
<html>
<head>
    <title>CSS Basic</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>CSS Basic</h1>

<div style="background: lightblue; height:100px; width:200px;">
    Box
</div>

<p style="color:red; text-align:center;">
    Styled text
</p>

<div style="border: 2px solid black;">
    Border example
</div>

<h2>Display vs Visibility</h2>
<p style="display:none;">Hidden using display</p>
<p style="visibility:hidden;">Hidden using visibility</p>

<h2>Padding and Margin</h2>
<div style="margin:20px; padding:10px; border:1px solid;">
    Box spacing
</div>

<h2>Multiple Background</h2>
<div style="height:100px; background:
url('https://via.placeholder.com/50'),
url('https://via.placeholder.com/50');">
</div>

</body>
</html>
