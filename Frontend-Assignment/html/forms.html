<!DOCTYPE html>
<html>
<head>
    <title>HTML Forms</title>
</head>

<body>

<h1>HTML Forms</h1>

<form>
    Name: <input type="text" required><br><br>
    Password: <input type="password"><br><br>

    Gender:
    <input type="radio" name="g"> Male
    <input type="radio" name="g"> Female<br><br>

    Skills:
    <input type="checkbox"> Java
    <input type="checkbox"> HTML<br><br>

    Email: <input type="email" required><br><br>
    Date: <input type="date"><br><br>
    Range: <input type="range" min="0" max="10"><br><br>

    File: <input type="file"><br><br>

    <input type="submit">
</form>

<h2>Marquee</h2>
<marquee>Welcome to Forms Page</marquee>

<h2>Iframe</h2>
<iframe src="https://example.com" width="300" height="150"></iframe>

</body>
</html>
