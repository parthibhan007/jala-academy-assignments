<!DOCTYPE html>
<html lang="en" ng-app="routingApp">
<head>
  <meta charset="UTF-8" />
  <title>AngularJS Routing & Animations</title>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-animate.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f4; color: #333; }

    header {
      background: #2c5f8a;
      color: white;
      padding: 15px 30px;
    }
    header h1 { margin: 0; font-size: 24px; }

    nav {
      background: #1e4a70;
      padding: 10px 30px;
    }
    nav a {
      color: white; margin-right: 18px;
      text-decoration: none; font-weight: bold; font-size: 15px;
    }
    nav a:hover { color: orange; }
    nav a.active { border-bottom: 2px solid orange; color: orange; }

    .page-content {
      padding: 30px;
      max-width: 700px;
    }

    .view-anim {
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .view-anim.ng-enter {
      opacity: 0;
      transform: translateY(20px);
    }
    .view-anim.ng-enter.ng-enter-active {
      opacity: 1;
      transform: translateY(0);
    }
    .view-anim.ng-leave {
      opacity: 1;
    }
    .view-anim.ng-leave.ng-leave-active {
      opacity: 0;
    }

    .card {
      background: white;
      padding: 25px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .card h2 { color: #2c5f8a; margin-top: 0; }

    .hero-home {
      background: #d0e8ff;
      padding: 30px;
      border-radius: 8px;
      text-align: center;
    }
    .hero-home h2 { color: #1e4a70; font-size: 28px; }

    button {
      background: #2c5f8a; color: white;
      padding: 9px 18px; border: none;
      border-radius: 4px; cursor: pointer;
      margin: 5px 5px 0 0;
    }
    button:hover { background: #1e4a70; }

    table { width: 100%; border-collapse: collapse; }
    th { background: #2c5f8a; color: white; padding: 9px; text-align: left; }
    td { padding: 8px; border: 1px solid #ddd; }
    tr:nth-child(even) { background: #f0f6ff; }

    .toggle-box {
      background: #ffd9a0;
      padding: 20px;
      text-align: center;
      border-radius: 6px;
      font-size: 18px;
      font-weight: bold;
      color: #7a3e00;
    }

    /* ng-show animation */
    .ng-hide-add, .ng-hide-remove {
      transition: all 0.4s ease;
    }
    .ng-hide-add { opacity: 1; }
    .ng-hide-add.ng-hide-add-active { opacity: 0; }
    .ng-hide-remove { opacity: 0; }
    .ng-hide-remove.ng-hide-remove-active { opacity: 1; }

    .route-info {
      background: #fff8cc;
      border-left: 4px solid orange;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <h1>AngularJS Routing & Animations</h1>
  </header>

  <nav>
    <a href="#/">Home</a>
    <a href="#/students">Students</a>
    <a href="#/about">About</a>
    <a href="#/contact">Contact</a>
  </nav>

  <!-- ng-view: this is where routed views are loaded -->
  <div class="page-content">
    <div ng-view class="view-anim"></div>
  </div>

  <!-- Inline templates using ng-template -->
  <script type="text/ng-template" id="home.html">
    <div class="hero-home">
      <h2>Welcome to the AngularJS Routing Demo</h2>
      <p>Use the navigation above to switch between pages. Notice the animated transitions.</p>
      <p style="color:#2c5f8a; font-size:14px;">Current route: <strong>#/</strong></p>
    </div>

    <div class="card" style="margin-top:15px;">
      <h2>About Routing</h2>
      <div class="route-info">
        Routing is configured in the AngularJS module using <code>$routeProvider</code>.
        Each URL path maps to a template and controller.
      </div>
      <ul>
        <li><strong>#/</strong> → Home page</li>
        <li><strong>#/students</strong> → Students list</li>
        <li><strong>#/about</strong> → About page</li>
        <li><strong>#/contact</strong> → Contact page</li>
        <li><strong>any unknown URL</strong> → Redirects to Home (using otherwise())</li>
      </ul>
    </div>
  </script>

  <script type="text/ng-template" id="students.html">
    <div class="card" ng-controller="StudentsCtrl">
      <h2>Students Table</h2>

      <div class="route-info">Loaded via <code>#/students</code> route</div>

      <!-- ng-show/ng-hide with animation -->
      <button ng-click="showTable = !showTable">Toggle Table</button>
      <p style="font-size:13px; color:#666; margin-top:6px;">showTable = {{ showTable }}</p>

      <div ng-show="showTable">
        <table>
          <thead>
            <tr><th>#</th><th>Name</th><th>Course</th><th>Score</th></tr>
          </thead>
          <tbody>
            <tr ng-repeat="s in students">
              <td>{{ $index + 1 }}</td>
              <td>{{ s.name }}</td>
              <td>{{ s.course }}</td>
              <td>{{ s.score }}</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div ng-hide="showTable" class="toggle-box" style="margin-top:10px;">
        Table is hidden. Click Toggle to show it.
      </div>
    </div>
  </script>

  <script type="text/ng-template" id="about.html">
    <div class="card">
      <h2>About This Project</h2>
      <div class="route-info">Loaded via <code>#/about</code> route</div>
      <p>This is a Frontend Assignment project demonstrating HTML, CSS, JavaScript, and AngularJS features.</p>
      <p>The assignment covers:</p>
      <ul>
        <li>HTML Basics, Forms, and Semantic Elements</li>
        <li>CSS Basics, Layout, Effects, and Advanced</li>
        <li>JavaScript Basics, Events, and Advanced</li>
        <li>AngularJS Basics, JSON, Events, Forms, and Routing</li>
      </ul>
    </div>
  </script>

  <script type="text/ng-template" id="contact.html">
    <div class="card" ng-controller="ContactCtrl">
      <h2>Contact Us</h2>
      <div class="route-info">Loaded via <code>#/contact</code> route</div>
      <form ng-submit="sendMessage()" name="contactForm" novalidate>
        <div style="margin-bottom:12px;">
          <label style="display:block; font-weight:bold; margin-bottom:4px;">Name:</label>
          <input type="text" ng-model="form.name" required
                 style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;"
                 placeholder="Your name" />
        </div>
        <div style="margin-bottom:12px;">
          <label style="display:block; font-weight:bold; margin-bottom:4px;">Message:</label>
          <textarea ng-model="form.message" required rows="4"
                    style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;"
                    placeholder="Your message"></textarea>
        </div>
        <button type="submit" ng-disabled="contactForm.$invalid">Send Message</button>
      </form>
      <div ng-show="sent" style="background:#d4f5d4; padding:12px; border-radius:6px; margin-top:12px; color:#2a6b2a; font-weight:bold;">
        Message sent! Thank you, {{ form.name }}.
      </div>
    </div>
  </script>

  <p style="padding: 0 30px; margin-top: 0;"><a href="../index.html">← Back to Home</a></p>

  <script>
    var app = angular.module("routingApp", ["ngRoute", "ngAnimate"]);

    // Configure routes using $routeProvider
    app.config(function($routeProvider) {
      $routeProvider
        .when("/", {
          templateUrl: "home.html",
          controller: "HomeCtrl"
        })
        .when("/students", {
          templateUrl: "students.html"
          // controller is defined inline in template with ng-controller
        })
        .when("/about", {
          templateUrl: "about.html"
        })
        .when("/contact", {
          templateUrl: "contact.html"
          // controller is defined inline in template
        })
        .otherwise({
          redirectTo: "/"  // unknown routes redirect to home
        });
    });

    app.controller("HomeCtrl", function($scope) {
      // Home page controller
    });

    app.controller("StudentsCtrl", function($scope) {
      $scope.showTable = true;
      $scope.students = [
        { name: "Rahul",  course: "HTML",       score: 90 },
        { name: "Priya",  course: "CSS",        score: 85 },
        { name: "Arjun",  course: "JavaScript", score: 78 },
        { name: "Sneha",  course: "AngularJS",  score: 92 },
        { name: "Vikram", course: "Bootstrap",  score: 70 }
      ];
    });

    app.controller("ContactCtrl", function($scope) {
      $scope.form = { name: "", message: "" };
      $scope.sent = false;
      $scope.sendMessage = function() {
        $scope.sent = true;
      };
    });
  </script>

</body>
</html>
